<div class="app-shell">
  <!-- Left sidebar -->
  <app-sidebar (newDocumentRequested)="pdfViewer.openFilePicker()" />

  <app-pdf-viewer
    #pdfViewer
    class="upload-handler"
    aria-hidden="true"
    (uploadStateChange)="chatPanel.onUploadStateChange($event)"
  />

  <!-- Main area: header + content -->
  <div class="main-area">
    <app-top-header />

    <!-- Main content -->
    <div class="content-area">
      <app-chat-panel #chatPanel (uploadRequested)="pdfViewer.openFilePicker()" />
    </div>
  </div>
</div>
