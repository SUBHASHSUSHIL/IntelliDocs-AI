<aside class="sidebar" [class.collapsed]="collapsed()">
  <!-- Logo -->
  <div class="sidebar-logo">
    <div class="logo-mark">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" fill="#2563eb"/>
        <path d="M8 12h8M12 8v8" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    @if (!collapsed()) {
      <span class="logo-text">IntelliDocs AI</span>
    }
    <button class="collapse-btn" (click)="toggleCollapse()" [title]="collapsed() ? 'Expand' : 'Collapse'">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        @if (!collapsed()) {
          <path d="M15 18l-6-6 6-6"/>
          <path d="M21 18l-6-6 6-6"/>
        } @else {
          <path d="M9 18l6-6-6-6"/>
          <path d="M3 18l6-6-6-6"/>
        }
      </svg>
    </button>
  </div>

  <!-- New Document Button -->
  <button class="new-doc-btn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
      <line x1="12" y1="11" x2="12" y2="17"/>
      <line x1="9" y1="14" x2="15" y2="14"/>
    </svg>
    @if (!collapsed()) {
      <span>New Document</span>
    }
  </button>

  @if (!collapsed()) {
    <!-- Search -->
    <div class="search-box">
      <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input
        type="text"
        placeholder="Search"
        [(ngModel)]="searchQuery"
        class="search-input"
        aria-label="Search history"
      />
    </div>

    <!-- Recent Document -->
    <div class="recent-doc">
      <button class="recent-doc-nav" aria-label="Previous">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <div class="recent-doc-info">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
        <div class="recent-doc-text">
          <span class="recent-doc-name">{{ recentDoc().name }}</span>
          <span class="recent-doc-date">{{ recentDoc().date }}</span>
        </div>
      </div>
    </div>

    <!-- Search History -->
    <div class="history-section">
      <h3 class="history-title">Search History</h3>
      @for (group of filteredGroups(); track group.label) {
        <div class="history-group">
          <p class="history-group-label">{{ group.label }}</p>
          @for (item of group.items; track item.id) {
            <button
              class="history-item"
              [class.active]="item.isActive"
              (click)="setActive(item.id)"
            >
              @if (item.isActive) {
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="11" cy="11" r="8"/>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
              } @else {
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2">
                  <circle cx="11" cy="11" r="8"/>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
              }
              <span>{{ item.text }}</span>
            </button>
          }
        </div>
      }
    </div>
  }
</aside>
