<aside class="sidebar" [class.collapsed]="collapsed()">
  <!-- Logo -->
  <div class="sidebar-logo">
    @if (collapsed()) {
      <button class="logo-mark logo-expand-btn" (click)="toggleCollapse()" aria-label="Expand sidebar" title="Expand sidebar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" fill="#2563eb"/>
          <path d="M8 12h8M12 8v8" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    } @else {
      <div class="logo-mark">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" fill="#2563eb"/>
          <path d="M8 12h8M12 8v8" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="logo-text">IntelliDocs AI</span>
    }
  </div>

  <nav class="sidebar-tool-icons" aria-label="Quick access">
    <button type="button" class="sidebar-tool-icon active" aria-label="New chat">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="M12 20h9"/>
        <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z"/>
      </svg>
      @if (!collapsed()) { <span>New chat</span> }
    </button>
    <button type="button" class="sidebar-tool-icon" aria-label="Search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/>
        <path d="m20 20-4-4"/>
      </svg>
      @if (!collapsed()) { <span>Search</span> }
    </button>
    <button type="button" class="sidebar-tool-icon" aria-label="Scheduled">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8Z"/>
      </svg>
      @if (!collapsed()) { <span>Scheduled</span> }
    </button>
    <button type="button" class="sidebar-tool-icon" aria-label="Library">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/>
        <path d="M8 7h8M8 11h8"/>
      </svg>
      @if (!collapsed()) { <span>Library</span> }
    </button>
  </nav>

  @if (!collapsed()) {
  <button class="collapse-btn" (click)="toggleCollapse()" title="Collapse sidebar" aria-label="Collapse sidebar">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M15 18l-6-6 6-6"/>
      <path d="M21 18l-6-6 6-6"/>
    </svg>
  </button>

  <!-- New Document Button -->
  <button class="new-doc-btn" (click)="newDocumentRequested.emit()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
      <line x1="12" y1="11" x2="12" y2="17"/>
      <line x1="9" y1="14" x2="15" y2="14"/>
    </svg>
    <span>New Document</span>
  </button>

    <!-- Search -->
    <div class="search-box">
      <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input
        type="text"
        placeholder="Search"
        [(ngModel)]="searchQuery"
        class="search-input"
        aria-label="Search history"
      />
    </div>

    <!-- Recent Document -->
    <div class="recent-doc">
      <button class="recent-doc-nav" aria-label="Previous">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <div class="recent-doc-info">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
        <div class="recent-doc-text">
          <span class="recent-doc-name">{{ recentDoc().name }}</span>
          <span class="recent-doc-date">{{ recentDoc().date }}</span>
        </div>
      </div>
    </div>

    <!-- Search History -->
    <div class="history-section">
      <h3 class="history-title">Search History</h3>
      @for (group of filteredGroups(); track group.label) {
        <div class="history-group">
          <p class="history-group-label">{{ group.label }}</p>
          @for (item of group.items; track item.id) {
            <button
              class="history-item"
              [class.active]="item.isActive"
              (click)="setActive(item.id)"
            >
              @if (item.isActive) {
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="11" cy="11" r="8"/>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
              } @else {
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2">
                  <circle cx="11" cy="11" r="8"/>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
              }
              <span>{{ item.text }}</span>
            </button>
          }
        </div>
      }
    </div>
  }

  <button
    class="settings-btn"
    aria-label="Settings"
    aria-haspopup="menu"
    [attr.aria-expanded]="settingsOpen()"
    aria-controls="settings-flyout"
    (click)="toggleSettings()"
  >
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.7 2.94-.08-.02a1.7 1.7 0 0 0-1.8.45l-.06.06h-3.4l-.02-.08a1.7 1.7 0 0 0-1.34-1.34l-.08-.02-1.7-2.94.06-.06A1.7 1.7 0 0 0 10 14.1v-.08l-1.7-2.94.02-.08a1.7 1.7 0 0 0-.45-1.8l-.06-.06 1.7-2.94.08.02a1.7 1.7 0 0 0 1.8-.45l.06-.06h3.4l.02.08a1.7 1.7 0 0 0 1.34 1.34l.08.02 1.7 2.94-.06.06a1.7 1.7 0 0 0-.34 1.88v.08l.06.1z"/>
    </svg>
    @if (!collapsed()) {
      <span>Settings</span>
    }
  </button>

  @if (settingsOpen()) {
    <div class="settings-flyout" id="settings-flyout" role="menu" aria-label="Account and settings">
        <button type="button" class="settings-profile settings-menu-button" role="menuitem" (click)="closeSettings()">
          <span class="settings-avatar">ST</span>
          <span class="settings-profile-info">
            <span class="settings-profile-name">Sushil Thakur</span>
            <span class="settings-profile-plan">Go</span>
          </span>
          <svg class="settings-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="m9 18 6-6-6-6"/>
          </svg>
        </button>

        <div class="settings-menu-items">
          <button type="button" class="settings-menu-item" role="menuitem" (click)="closeSettings()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <path d="m12 3 1.7 5.3L19 10l-5.3 1.7L12 17l-1.7-5.3L5 10l5.3-1.7L12 3Z"/>
              <path d="m19 16 .8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16Z"/>
            </svg>
            <span>Upgrade plan</span>
          </button>
          <button type="button" class="settings-menu-item" role="menuitem" (click)="closeSettings()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <circle cx="12" cy="12" r="9"/>
              <path d="M12 7v5l3 2"/>
            </svg>
            <span>Personalization</span>
          </button>
          <button type="button" class="settings-menu-item" role="menuitem" (click)="closeSettings()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <circle cx="12" cy="8" r="3"/>
              <path d="M5 20a7 7 0 0 1 14 0"/>
              <circle cx="12" cy="12" r="10"/>
            </svg>
            <span>Profile</span>
          </button>
          <button type="button" class="settings-menu-item" role="menuitem" (click)="closeSettings()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <circle cx="12" cy="12" r="3"/>
              <path d="m19.4 15 .1.1a1.7 1.7 0 0 1-2.4 2.4l-.1-.1a1.7 1.7 0 0 0-2.9 1.2v.2a1.7 1.7 0 0 1-3.4 0v-.2a1.7 1.7 0 0 0-2.9-1.2l-.1.1a1.7 1.7 0 0 1-2.4-2.4l.1-.1a1.7 1.7 0 0 0-1.2-2.9H4a1.7 1.7 0 0 1 0-3.4h.2a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a1.7 1.7 0 0 1 2.4-2.4l.1.1a1.7 1.7 0 0 0 2.9-1.2V2a1.7 1.7 0 0 1 3.4 0v.2a1.7 1.7 0 0 0 2.9 1.2l.1-.1a1.7 1.7 0 0 1 2.4 2.4l-.1.1a1.7 1.7 0 0 0 1.2 2.9h.2a1.7 1.7 0 0 1 0 3.4h-.2a1.7 1.7 0 0 0-1.2 2.9Z"/>
            </svg>
            <span>Settings</span>
          </button>
        </div>

        <div class="settings-menu-items settings-menu-footer">
          <button type="button" class="settings-menu-item" role="menuitem" (click)="closeSettings()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <circle cx="12" cy="12" r="9"/>
              <circle cx="12" cy="12" r="3"/>
              <path d="M12 3v3m0 12v3m9-9h-3M6 12H3"/>
            </svg>
            <span>Help</span>
            <svg class="settings-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="m9 18 6-6-6-6"/>
            </svg>
          </button>
          <button type="button" class="settings-menu-item" role="menuitem" (click)="closeSettings()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <path d="M10 17l5-5-5-5"/>
              <path d="M15 12H3"/>
              <path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"/>
            </svg>
            <span>Log out</span>
          </button>
        </div>
    </div>
  }
</aside>
