<header class="top-header">
  <div class="header-left">
    <button class="doc-name-btn" aria-label="Document options">
      <app-icon name="file" size="16" />
      <span>{{ docName() }}</span>
      <app-icon name="chevron-down" size="14" />
    </button>
  </div>

  <div class="header-right">
    <button class="icon-btn" aria-label="Notifications">
      <app-icon name="bell" size="18" />
    </button>

    <div class="user-profile">
      <div class="avatar" aria-label="User avatar">
        <img
          src="https://ui-avatars.com/api/?name=Sushil+Thakur&background=3b82f6&color=fff&size=32"
          alt="{{ userName() }}"
          width="32"
          height="32"
        />
      </div>
      <span class="user-name">{{ userName() }}</span>
    </div>

    <button class="icon-btn" aria-label="More options">
      <app-icon name="dots-vertical" size="18" />
    </button>
  </div>
</header>
